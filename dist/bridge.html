<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MagSafe Mac helper</title>
  <link rel="stylesheet" href="./style.css?v=8">
  <script type="module" src="./bridge.mjs"></script>
</head>
<body>
  <main>
    <h1>MagSafe Mac helper</h1>
    <p class="subtitle">Allow the open luke.lol monitor to read diagnostics and start or stop the connected A2140 USB stream. Keep this window open while monitoring.</p>
    <div class="actions">
      <button type="button" id="allow" class="primary" disabled>Allow this session</button>
    </div>
    <p role="status" id="pair-status">Open this window from the MagSafe Monitor.</p>
  </main>
</body>
</html>
